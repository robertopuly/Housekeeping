<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Ciel d'automne doré et doux -->
    <linearGradient id="autSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="35%" stop-color="#ffedd5"/>
      <stop offset="65%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Soleil d'or d'automne -->
    <radialGradient id="autSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Collines d'automne lointaines -->
    <linearGradient id="autHillFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="autHillMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="autHillNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Dégradés de feuillage jaune & orange vif -->
    <radialGradient id="leafYellow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="90%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <radialGradient id="leafOrange" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </radialGradient>
    <radialGradient id="leafGold" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="leafAmberRed" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <!-- Tronc de bouleau / chêne -->
    <linearGradient id="trunkBark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="35%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="birchTrunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Brume dorée matinale -->
    <linearGradient id="goldenMist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#fed7aa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>

    <!-- Voile lumineux apaisant pour lisibilité du chat -->
    <linearGradient id="chatReadabilityOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffedd5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- FOND DU CIEL DORÉ -->
  <rect width="1920" height="1080" fill="url(#autSky)"/>

  <!-- SOLEIL D'AUTOMNE DOUX ET RAYONS -->
  <g transform="translate(1320, 260)">
    <circle cx="0" cy="0" r="320" fill="url(#autSun)"/>
    <circle cx="0" cy="0" r="75" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- OISEAUX MIGRATEURS AU LOIN EN VOL V -->
  <g fill="#9a3412" opacity="0.4" stroke="#9a3412" stroke-width="1.8" stroke-linecap="round">
    <path d="M 1150 140 Q 1156 133 1162 140 Q 1168 133 1174 140"/>
    <path d="M 1175 160 Q 1180 154 1185 160 Q 1190 154 1195 160"/>
    <path d="M 1195 180 Q 1200 175 1205 180 Q 1210 175 1215 180"/>
    <path d="M 1215 200 Q 1219 196 1223 200 Q 1227 196 1231 200"/>
    <path d="M 1230 220 Q 1234 216 1238 220 Q 1242 216 1246 220"/>
  </g>

  <!-- COLLINES BOISÉES LOINTAINES AVEC ARBRES OR ET ORANGE -->
  <path d="M 0 620 Q 360 520 840 590 Q 1320 660 1920 540 L 1920 1080 L 0 1080 Z" fill="url(#autHillFar)"/>

  <!-- COLLINES MOYENNES CHÂTOYANTES -->
  <path d="M 0 710 Q 450 640 1020 720 Q 1520 780 1920 670 L 1920 1080 L 0 1080 Z" fill="url(#autHillMid)"/>

  <!-- FORÊT D'ARBRES LOINTAINS AUX COULEURS D'AUTOMNE -->
  <g opacity="0.75">
    <!-- Arbres lointains gauche -->
    <ellipse cx="120" cy="590" rx="65" ry="85" fill="url(#leafOrange)"/>
    <ellipse cx="210" cy="580" rx="75" ry="95" fill="url(#leafYellow)"/>
    <ellipse cx="310" cy="610" rx="70" ry="85" fill="url(#leafGold)"/>
    <ellipse cx="430" cy="590" rx="80" ry="100" fill="url(#leafAmberRed)"/>
    <ellipse cx="540" cy="620" rx="70" ry="85" fill="url(#leafYellow)"/>

    <!-- Arbres lointains droite -->
    <ellipse cx="1450" cy="610" rx="75" ry="90" fill="url(#leafGold)"/>
    <ellipse cx="1560" cy="580" rx="80" ry="100" fill="url(#leafOrange)"/>
    <ellipse cx="1680" cy="600" rx="70" ry="90" fill="url(#leafYellow)"/>
    <ellipse cx="1790" cy="570" rx="85" ry="105" fill="url(#leafAmberRed)"/>
  </g>

  <!-- BRUME DORÉE D'AUTOMNE -->
  <rect x="0" y="580" width="1920" height="280" fill="url(#goldenMist)"/>

  <!-- COLLINE DU PREMIER PLAN -->
  <path d="M 0 830 Q 420 780 940 840 Q 1460 900 1920 810 L 1920 1080 L 0 1080 Z" fill="url(#autHillNear)"/>

  <!-- ========================================== -->
  <!-- GRAND ARBRE D'AUTOMNE GAUCHE (ÉABLE / CHÊNE MAJESTUEUX) -->
  <!-- ========================================== -->
  <g id="bigAutumnTreeLeft">
    <!-- Tronc et branches épaisses -->
    <path d="M 70 1080 Q 95 890 140 760 Q 170 660 210 540 Q 235 480 250 390 L 265 395 Q 245 490 220 570 Q 255 520 320 470 Q 380 430 460 410 L 455 425 Q 375 445 315 490 Q 245 550 215 650 Q 185 770 160 890 Q 140 980 180 1080 Z" fill="url(#trunkBark)"/>
    <path d="M 175 690 Q 120 630 65 570 Q 30 530 0 490 L 0 505 Q 35 545 75 590 Q 130 650 165 720 Z" fill="url(#trunkBark)"/>
    <path d="M 230 540 Q 270 470 330 420 Q 380 380 420 350 L 415 365 Q 370 395 320 440 Q 260 490 220 560 Z" fill="url(#trunkBark)"/>

    <!-- Masses de feuillage jaune éclatant & orange chaleureux (Superposition volumétrique) -->
    <!-- Arrière-plan feuillage foncé -->
    <circle cx="160" cy="460" r="110" fill="#c2410c" opacity="0.9"/>
    <circle cx="340" cy="410" r="120" fill="#b91c1c" opacity="0.85"/>
    <circle cx="260" cy="330" r="125" fill="#ea580c" opacity="0.9"/>

    <!-- Couche moyenne : Orange flamboyant -->
    <circle cx="110" cy="420" r="95" fill="url(#leafOrange)"/>
    <circle cx="210" cy="360" r="115" fill="url(#leafOrange)"/>
    <circle cx="330" cy="350" r="110" fill="url(#leafOrange)"/>
    <circle cx="430" cy="390" r="85" fill="url(#leafOrange)"/>
    <circle cx="260" cy="270" r="110" fill="url(#leafOrange)"/>

    <!-- Couche supérieure : Jaune doré & or intense lumineux -->
    <circle cx="150" cy="360" r="90" fill="url(#leafYellow)"/>
    <circle cx="240" cy="290" r="105" fill="url(#leafGold)"/>
    <circle cx="350" cy="310" r="95" fill="url(#leafYellow)"/>
    <circle cx="190" cy="240" r="85" fill="url(#leafYellow)"/>
    <circle cx="290" cy="230" r="95" fill="url(#leafGold)"/>
    <circle cx="380" cy="340" r="70" fill="url(#leafYellow)"/>
    <circle cx="270" cy="180" r="75" fill="url(#leafYellow)"/>

    <!-- Petits nuages de feuilles étincelantes sur les bords -->
    <circle cx="70" cy="470" r="45" fill="url(#leafGold)"/>
    <circle cx="90" cy="380" r="50" fill="url(#leafYellow)"/>
    <circle cx="470" cy="360" r="55" fill="url(#leafOrange)"/>
    <circle cx="430" cy="290" r="50" fill="url(#leafYellow)"/>
    <circle cx="340" cy="190" r="55" fill="url(#leafGold)"/>
    <circle cx="150" cy="270" r="55" fill="url(#leafYellow)"/>
  </g>

  <!-- SECOND ARBRE D'AUTOMNE (BOULEAU BLANC D'OR - MILIEU GAUCHE) -->
  <g id="birchTreeLeft">
    <path d="M 490 1080 L 505 1080 Q 515 900 525 790 Q 535 690 540 580 Q 542 500 545 420 L 535 420 Q 530 500 525 580 Q 515 690 500 810 Q 485 930 490 1080 Z" fill="url(#birchTrunk)"/>
    <!-- Marques d'écorce de bouleau -->
    <line x1="492" y1="950" x2="504" y2="952" stroke="#1e293b" stroke-width="2.5"/>
    <line x1="500" y1="880" x2="512" y2="883" stroke="#1e293b" stroke-width="2"/>
    <line x1="510" y1="800" x2="522" y2="802" stroke="#1e293b" stroke-width="2"/>
    <line x1="520" y1="710" x2="530" y2="712" stroke="#1e293b" stroke-width="2"/>
    <!-- Canopée dorée en cascade légère -->
    <circle cx="545" cy="420" r="75" fill="url(#leafGold)" opacity="0.95"/>
    <circle cx="520" cy="360" r="65" fill="url(#leafYellow)"/>
    <circle cx="580" cy="370" r="60" fill="url(#leafOrange)"/>
    <circle cx="540" cy="310" r="55" fill="url(#leafYellow)"/>
  </g>

  <!-- ========================================== -->
  <!-- GRAND ARBRE D'AUTOMNE DROIT (ÉABLE GÉANT ORANGE & OR) -->
  <!-- ========================================== -->
  <g id="bigAutumnTreeRight">
    <path d="M 1830 1080 Q 1805 890 1765 760 Q 1735 660 1695 540 Q 1670 480 1655 390 L 1640 395 Q 1660 490 1685 570 Q 1650 520 1585 470 Q 1525 430 1445 410 L 1450 425 Q 1530 445 1590 490 Q 1660 550 1690 650 Q 1720 770 1745 890 Q 1765 980 1725 1080 Z" fill="url(#trunkBark)"/>
    <path d="M 1730 690 Q 1785 630 1840 570 Q 1875 530 1905 490 L 1905 505 Q 1870 545 1830 590 Q 1775 650 1740 720 Z" fill="url(#trunkBark)"/>
    <path d="M 1675 540 Q 1635 470 1575 420 Q 1525 380 1485 350 L 1490 365 Q 1535 395 1585 440 Q 1645 490 1685 560 Z" fill="url(#trunkBark)"/>

    <!-- Feuillage droit luxuriant aux tons d'automne éclatants -->
    <circle cx="1740" cy="460" r="110" fill="#b91c1c" opacity="0.9"/>
    <circle cx="1560" cy="410" r="120" fill="#c2410c" opacity="0.85"/>
    <circle cx="1640" cy="330" r="125" fill="#ea580c" opacity="0.9"/>

    <circle cx="1790" cy="420" r="95" fill="url(#leafOrange)"/>
    <circle cx="1690" cy="360" r="115" fill="url(#leafOrange)"/>
    <circle cx="1570" cy="350" r="110" fill="url(#leafOrange)"/>
    <circle cx="1470" cy="390" r="85" fill="url(#leafOrange)"/>
    <circle cx="1640" cy="270" r="110" fill="url(#leafOrange)"/>

    <circle cx="1750" cy="360" r="90" fill="url(#leafYellow)"/>
    <circle cx="1660" cy="290" r="105" fill="url(#leafGold)"/>
    <circle cx="1550" cy="310" r="95" fill="url(#leafYellow)"/>
    <circle cx="1710" cy="240" r="85" fill="url(#leafYellow)"/>
    <circle cx="1610" cy="230" r="95" fill="url(#leafGold)"/>
    <circle cx="1520" cy="340" r="70" fill="url(#leafYellow)"/>
    <circle cx="1630" cy="180" r="75" fill="url(#leafYellow)"/>

    <!-- Finitions de feuillage sur les pointes -->
    <circle cx="1830" cy="470" r="45" fill="url(#leafGold)"/>
    <circle cx="1810" cy="380" r="50" fill="url(#leafYellow)"/>
    <circle cx="1430" cy="360" r="55" fill="url(#leafOrange)"/>
    <circle cx="1470" cy="290" r="50" fill="url(#leafYellow)"/>
    <circle cx="1560" cy="190" r="55" fill="url(#leafGold)"/>
    <circle cx="1750" cy="270" r="55" fill="url(#leafYellow)"/>
  </g>

  <!-- SECOND BOULEAU DROIT -->
  <g id="birchTreeRight">
    <path d="M 1395 1080 L 1408 1080 Q 1415 900 1422 790 Q 1428 690 1432 580 Q 1434 500 1436 430 L 1426 430 Q 1422 500 1418 580 Q 1410 690 1400 810 Q 1390 930 1395 1080 Z" fill="url(#birchTrunk)"/>
    <line x1="1398" y1="940" x2="1408" y2="942" stroke="#1e293b" stroke-width="2"/>
    <line x1="1405" y1="860" x2="1415" y2="863" stroke="#1e293b" stroke-width="2"/>
    <line x1="1412" y1="780" x2="1422" y2="782" stroke="#1e293b" stroke-width="2"/>
    <circle cx="1435" cy="430" r="70" fill="url(#leafYellow)" opacity="0.95"/>
    <circle cx="1410" cy="370" r="60" fill="url(#leafGold)"/>
    <circle cx="1465" cy="380" r="55" fill="url(#leafOrange)"/>
  </g>

  <!-- SOL COUVERT D'UN TAPIS DE FEUILLES D'AUTOMNE JAUNES & ORANGES -->
  <path d="M 0 950 Q 480 910 960 940 Q 1440 970 1920 920 L 1920 1080 L 0 1080 Z" fill="#78350f"/>
  <ellipse cx="280" cy="990" rx="220" ry="40" fill="url(#leafOrange)" opacity="0.6"/>
  <ellipse cx="620" cy="1010" rx="180" ry="35" fill="url(#leafYellow)" opacity="0.5"/>
  <ellipse cx="1180" cy="1000" rx="260" ry="45" fill="url(#leafGold)" opacity="0.55"/>
  <ellipse cx="1650" cy="980" rx="240" ry="42" fill="url(#leafOrange)" opacity="0.6"/>

  <!-- ========================================== -->
  <!-- FEUILLES D'AUTOMNE QUI VOLENT DANS LE VENT (MAPLE & OAK LEAVES) -->
  <!-- ========================================== -->
  <g id="fallingAutumnLeaves">
    <!-- Feuille d'érable 1 - Jaune vif (Gauche milieu) -->
    <path d="M 0 -18 L 4 -7 L 14 -12 L 8 -2 L 17 4 L 7 6 L 10 16 L 2 10 L 0 22 L -2 10 L -10 16 L -7 6 L -17 4 L -8 -2 L -14 -12 L -4 -7 Z" fill="#facc15" transform="translate(390, 620) rotate(35) scale(1.3)" filter="drop-shadow(0 2px 4px rgba(120,53,15,0.3))"/>
    
    <!-- Feuille d'érable 2 - Orange flamboyant (Centre haut) -->
    <path d="M 0 -18 L 4 -7 L 14 -12 L 8 -2 L 17 4 L 7 6 L 10 16 L 2 10 L 0 22 L -2 10 L -10 16 L -7 6 L -17 4 L -8 -2 L -14 -12 L -4 -7 Z" fill="#ea580c" transform="translate(820, 360) rotate(-42) scale(1.1)" filter="drop-shadow(0 2px 4px rgba(120,53,15,0.25))"/>

    <!-- Feuille d'érable 3 - Or Ambré (Centre milieu) -->
    <path d="M 0 -18 L 4 -7 L 14 -12 L 8 -2 L 17 4 L 7 6 L 10 16 L 2 10 L 0 22 L -2 10 L -10 16 L -7 6 L -17 4 L -8 -2 L -14 -12 L -4 -7 Z" fill="#f59e0b" transform="translate(1080, 540) rotate(58) scale(1.2)" filter="drop-shadow(0 2px 4px rgba(120,53,15,0.25))"/>

    <!-- Feuille d'érable 4 - Rouge Carmin (Droite milieu) -->
    <path d="M 0 -18 L 4 -7 L 14 -12 L 8 -2 L 17 4 L 7 6 L 10 16 L 2 10 L 0 22 L -2 10 L -10 16 L -7 6 L -17 4 L -8 -2 L -14 -12 L -4 -7 Z" fill="#dc2626" transform="translate(1360, 640) rotate(-28) scale(1.15)" filter="drop-shadow(0 2px 4px rgba(120,53,15,0.3))"/>

    <!-- Feuilles ovales de bouleau / chêne qui tourbillonnent -->
    <path d="M 0 -14 C 12 -7 12 7 0 14 C -12 7 -12 -7 0 -14 Z" fill="#facc15" transform="translate(480, 480) rotate(65) scale(1.2)"/>
    <path d="M 0 -14 C 12 -7 12 7 0 14 C -12 7 -12 -7 0 -14 Z" fill="#f97316" transform="translate(680, 590) rotate(-15) scale(1.1)"/>
    <path d="M 0 -14 C 12 -7 12 7 0 14 C -12 7 -12 -7 0 -14 Z" fill="#ea580c" transform="translate(940, 420) rotate(80) scale(1.0)"/>
    <path d="M 0 -14 C 12 -7 12 7 0 14 C -12 7 -12 -7 0 -14 Z" fill="#fde047" transform="translate(1220, 460) rotate(-55) scale(1.2)"/>
    <path d="M 0 -14 C 12 -7 12 7 0 14 C -12 7 -12 -7 0 -14 Z" fill="#f59e0b" transform="translate(1480, 520) rotate(35) scale(1.3)"/>

    <!-- Feuilles près du sol qui tombent doucement -->
    <path d="M 0 -16 L 3 -6 L 12 -10 L 7 -2 L 15 3 L 6 5 L 8 14 L 2 9 L 0 19 L -2 9 L -8 14 L -6 5 L -15 3 L -7 -2 L -12 -10 L -3 -6 Z" fill="#ea580c" transform="translate(740, 780) rotate(-70) scale(1.2)"/>
    <path d="M 0 -16 L 3 -6 L 12 -10 L 7 -2 L 15 3 L 6 5 L 8 14 L 2 9 L 0 19 L -2 9 L -8 14 L -6 5 L -15 3 L -7 -2 L -12 -10 L -3 -6 Z" fill="#facc15" transform="translate(1120, 810) rotate(40) scale(1.25)"/>
  </g>

  <!-- VOILE DE CONFORT DE LECTURE CHAT -->
  <rect width="1920" height="1080" fill="url(#chatReadabilityOverlay)" pointer-events="none"/>
</svg>